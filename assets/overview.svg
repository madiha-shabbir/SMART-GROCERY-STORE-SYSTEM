<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<rect width="1000" height="700" fill="#fff"/><text x="500" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222">Project Overview</text>
<g font-family="Arial, sans-serif"><rect x="40" y="80" width="450" height="270" rx="16" fill="#f7f9fc" stroke="#2f80ed" stroke-width="3"/><text x="65" y="115" font-size="21" font-weight="700" fill="#2f80ed">grocery_store.py</text><text x="65" y="145" font-size="15" fill="#222">Topic: Lists, dictionaries, functions, loops</text><text x="65" y="174" font-size="15" fill="#222">Input: Product details, menu choices, sales</text><text x="65" y="203" font-size="15" fill="#222">Rules: Unique IDs, valid numbers, stock checks</text><text x="65" y="232" font-size="15" fill="#222">Output: Product views, sales, reports</text><text x="65" y="261" font-size="15" fill="#222">Concepts: Conditions, validation, comprehensions</text><text x="65" y="303" font-size="14" fill="#666">Single procedural module with reusable functions.</text>
<rect x="510" y="80" width="450" height="270" rx="16" fill="#f7f9fc" stroke="#7b3fb3" stroke-width="3"/><text x="535" y="115" font-size="21" font-weight="700" fill="#7b3fb3">README.md</text><text x="535" y="145" font-size="15" fill="#222">Topic: Documentation and test evidence</text><text x="535" y="174" font-size="15" fill="#222">Input: Repository instructions and outputs</text><text x="535" y="203" font-size="15" fill="#222">Rules: Relative assets and real test results</text><text x="535" y="232" font-size="15" fill="#222">Output: Run guide, flow, UML, test tables</text><text x="535" y="261" font-size="15" fill="#222">Concepts: GitHub-ready project structure</text><text x="535" y="303" font-size="14" fill="#666">Documents the actual code and verified behavior.</text>
<rect x="40" y="385" width="920" height="250" rx="16" fill="#f7f9fc" stroke="#2f9e63" stroke-width="3"/><text x="65" y="425" font-size="21" font-weight="700" fill="#2f9e63">Core application coverage</text><g font-size="15" fill="#222"><text x="70" y="465">• Add products with dictionaries and .append()</text><text x="70" y="495">• View and search by product ID or name</text><text x="70" y="525">• Update stock and reject insufficient sales</text><text x="70" y="555">• Store completed sales as dictionaries</text><text x="520" y="465">• Calculate revenue and inventory totals</text><text x="520" y="495">• Identify low-stock products</text><text x="520" y="525">• Find highest- and lowest-priced products</text><text x="520" y="555">• Keep the menu running until Exit</text></g></g></svg>
