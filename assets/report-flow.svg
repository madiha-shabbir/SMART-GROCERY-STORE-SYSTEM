<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#fff"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#222">Store Report Flow</text><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="400" y="65" width="200" height="55" rx="27" fill="#2f9e63"/><text x="500" y="99" fill="#fff">START</text><line x1="500" y1="120" x2="500" y2="150" stroke="#333" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="150" width="340" height="65" rx="12" fill="#dbeafe" stroke="#2f80ed"/><text x="500" y="190">Loop through products and sales</text><line x1="500" y1="215" x2="500" y2="255" stroke="#333" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="255" width="340" height="65" rx="12" fill="#f4f4f4" stroke="#777"/><text x="500" y="295">Calculate totals and revenue</text><line x1="500" y1="320" x2="500" y2="360" stroke="#333" stroke-width="3" marker-end="url(#a)"/><polygon points="500,360 650,435 500,510 350,435" fill="#eee0f8" stroke="#7b3fb3"/><text x="500" y="429">Low stock items?</text><line x1="650" y1="435" x2="770" y2="435" stroke="#d99000" stroke-width="3" marker-end="url(#a)"/><text x="710" y="415" fill="#d99000">YES</text><rect x="770" y="405" width="170" height="60" rx="12" fill="#fff4d6" stroke="#d99000"/><text x="855" y="441">List warnings</text><line x1="500" y1="510" x2="500" y2="550" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="520" y="535" fill="#777">NO</text><rect x="330" y="550" width="340" height="65" rx="12" fill="#e8f7ee" stroke="#2f9e63"/><text x="500" y="590">Find highest + lowest price</text><line x1="500" y1="615" x2="500" y2="655" stroke="#333" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="655" width="340" height="65" rx="12" fill="#e8f7ee" stroke="#2f9e63"/><text x="500" y="695">Display final report</text><line x1="500" y1="720" x2="500" y2="760" stroke="#333" stroke-width="3" marker-end="url(#a)"/><rect x="400" y="760" width="200" height="55" rx="27" fill="#2f9e63"/><text x="500" y="794" fill="#fff">END</text><line x1="855" y1="465" x2="855" y2="615" stroke="#d99000" stroke-width="3"/><line x1="855" y1="615" x2="670" y2="615" stroke="#d99000" stroke-width="3" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs></svg>
